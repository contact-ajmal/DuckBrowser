# Builds the DuckView desktop installers and attaches them to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0     → release with DMG (arm64 + x64) and Windows setup .exe
#   Actions → Release → Run workflow            → same artifacts, no release (for a dry run)
#
# Builds run natively on each OS. The binaries are unsigned (no Apple Developer /
# Windows code-signing certificate), so users get a Gatekeeper / SmartScreen prompt
# on first launch — see README → Desktop app.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Smoke test (Linux, headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Package ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (arm64 + x64 DMG)
            args: --mac --arm64 --x64
          - os: windows-latest
            label: Windows (x64 installer)
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: duckview-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Downloads
            | Platform | File |
            | --- | --- |
            | macOS · Apple Silicon | `DuckView-*-mac-arm64.dmg` |
            | macOS · Intel | `DuckView-*-mac-x64.dmg` |
            | Windows · 64-bit | `DuckView-*-windows-x64-setup.exe` |

            The builds are **unsigned**. macOS: right-click the app → *Open* the first time (or `xattr -dr com.apple.quarantine /Applications/DuckView.app`). Windows: SmartScreen → *More info* → *Run anyway*. Verify downloads against `SHA256SUMS.txt`.

            Everything runs on your machine; the app makes no network requests.
